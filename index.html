<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaseTask - Decentralized Task-to-Earn Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav class="container">
      <a href="/" onclick="navigateTo('/'); return false;" class="logo">BaseTask</a>
      <ul class="nav-links">
        <li><a href="/tasks" onclick="navigateTo('/tasks'); return false;">Browse Tasks</a></li>
        <li><a href="/create-task" onclick="navigateTo('/create-task'); return false;">Create Task</a></li>
        <li><a href="/dashboard" onclick="navigateTo('/dashboard'); return false;">Dashboard</a></li>
        <li>
          <button id="connectWalletBtn" class="btn btn-primary">Connect Wallet</button>
          <div id="walletInfo" class="wallet-info" style="display: none;">
            <span class="wallet-address" id="walletAddress"></span>
            <button onclick="disconnectWallet()" class="btn btn-outline" style="padding: 8px 16px;">Disconnect</button>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main app container - content will be injected here -->
  <main id="app"></main>

  <footer>
    <div class="container">
      <p>© 2025 BaseTask - Built on Base Sepolia Testnet</p>
    </div>
  </footer>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <!-- App Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/wallet.js"></script>
  <script src="/js/contract.js"></script>
  <script src="/js/router.js"></script>
  
  <script>
    // Handle wallet connection with router
    async function handleWalletConnect() {
      try {
        await connectWallet();
        navigateTo('/dashboard'); // Use router navigation
      } catch (error) {
        console.error('Connection error:', error);
      }
    }

    document.getElementById('connectWalletBtn').addEventListener('click', handleWalletConnect);

    // Check if already connected
    if (isWalletConnected()) {
      updateWalletUI();
    }
  </script>
</body>
</html>
